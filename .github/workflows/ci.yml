name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: localmind, POSTGRES_USER: localmind, POSTGRES_PASSWORD: localmind }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U localmind" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # docling (PyTorch) is only needed to parse real PDFs; the suite mocks it.
      - run: grep -v -E '^(docling|llama-cpp-python)' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt
      - name: Tests on SQLite
        run: python manage.py test --noinput
      - name: Tests on PostgreSQL
        run: python manage.py test --noinput
        env: { DATABASE_URL: "postgres://localmind:localmind@localhost:5432/localmind" }
      - name: Migrations are in sync
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_DEBUG: "true" }
      - name: Production settings load
        run: python manage.py check --deploy --fail-level ERROR
        env: { DJANGO_SECRET_KEY: "ci-only-secret-key-that-is-long-enough-0123456789", DJANGO_DEBUG: "false" }

  system-test:
    runs-on: ubuntu-latest
    needs: backend
    defaults: { run: { working-directory: backend } }
    env:
      DJANGO_DEBUG: "true"
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: grep -v -E '^(docling|llama-cpp-python)' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt
      - run: python manage.py migrate --noinput && python manage.py bootstrap_admin --email root@localmind.test
      - name: Start fake Ollama and the API
        run: |
          nohup python scripts/fake_ollama.py > /tmp/fake.log 2>&1 &
          nohup python manage.py runserver 127.0.0.1:8011 --noreload > /tmp/server.log 2>&1 &
          sleep 5
          python manage.py check_ai --smoke
      - name: Black-box system test (every portal, endpoint and fallback)
        run: python scripts/system_test.py http://127.0.0.1:8011 --fake-ollama http://127.0.0.1:11434
      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/server.log

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Web bundle compiles every route
        run: npx expo export --platform web --output-dir /tmp/webexport
