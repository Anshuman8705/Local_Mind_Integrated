# Reverse proxy in front of gunicorn. For TLS, terminate here (or in Caddy)
# and keep X-Forwarded-Proto so Django's SECURE_PROXY_SSL_HEADER sees https.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;          # must be >= MAX_UPLOAD_MB

    location /static/ { alias /srv/static/; expires 7d; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls can legitimately take a minute or two on CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
